services:
  service-a:
    build:
      context: .
      args:
        SERVICE: service-a
    ports:
      - "8080:8080"
    environment:
      SERVICE_B_URL: http://service-b:8081
      OTEL_SERVICE_NAME: service-a
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      - service-b
      - otel-collector

  service-b:
    build:
      context: .
      args:
        SERVICE: service-b
    ports:
      - "8081:8081"
    environment:
      # lido do .env da raiz; o compose falha se não estiver definido
      WEATHER_API_KEY: ${WEATHER_API_KEY:?defina WEATHER_API_KEY no .env}
      OTEL_SERVICE_NAME: service-b
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC, para rodar os serviços com go run fora do Docker
    depends_on:
      - zipkin

  zipkin:
    image: openzipkin/zipkin:3.6.1
    ports:
      - "9411:9411" # UI: http://localhost:9411
